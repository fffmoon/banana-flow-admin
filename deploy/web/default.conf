# gzip
gzip on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
gzip_vary on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 上游服务1
upstream backend_server {
    server banana-flow-admin-server-py:8000;
}

server {
    listen       80;
    server_name  localhost;

    # SSL证书验证目录相关设置，没用，因为我一般在npm中配置
    # ...
     
    #history模式站点目录配置
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
	location ^~ /static/ {
        alias /usr/share/nginx/static/; 
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(glb|gltf|bin|png|jpg|jpeg|exr|css|js|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后台接口地址
    location ^~ /api/ {
      # 配置跨域
      add_header "Access-Control-Allow-Origin" *;
	  
      # 最大上传 1024MB
      client_max_body_size 1024m; 
		
      proxy_set_header Host  $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # 配置代理端口到提供 http 接口的服务端口
      # localhost 指的是容器自己，而不是宿主机。容器内部并没有运行监听 8000 端口的服务，所以需要在docker-compose.yml中配置
      proxy_pass http://backend_server; 
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # 443省略不写

    
    # WebSocket 代理配置
    location ^~ /ws-api/ {
        add_header "Access-Control-Allow-Origin" *;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 配置代理端口到提供 ws 接口的服务端口
        proxy_pass http://backend_server;

        # 长连接超时设置
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    
    #charset koi8-r;
    access_log  /var/log/nginx/host.access.log  main;
    error_log  /var/log/nginx/error.log  error;


    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
