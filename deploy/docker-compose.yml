version: '3.8'

services:
  # ----------------------------------------
  # 数据库服务
  # ----------------------------------------
  mysql:
    image: mysql:8.0
    restart: always
    ports:
      - '${HOST_PORT_MYSQL:-3306}:3306'
    volumes:
      - ./data/mysql/lib:/var/lib/mysql
      - ./data/mysql/conf.d:/etc/mysql/conf.d
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - banana-flow-admin-network

  redis:
    image: redis:7.0
    restart: always
    ports:
      - '${HOST_PORT_REDIS:-6379}:6379'
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/redis:/data
    networks:
      - banana-flow-admin-network

  # ----------------------------------------
  # 后端服务
  # ----------------------------------------
  banana-flow-admin-server-py:
    image: banana-flow-admin-server-py:${SERVER_VERSION:-latest}
    container_name: banana-flow-admin-server-py
    restart: always
    ipc: host
    ports:
      - "${HOST_PORT_SERVER:-8000}:${PORT:-8000}"
    env_file:
      - .env
    volumes:
      - ./server/logs:/app/logs
      - ./server/import_data:/app/import_data
      - ./static:/app/static
    depends_on:
      - mysql
      - redis
    networks:
      - banana-flow-admin-network

  # ----------------------------------------
  # 前端服务
  # ----------------------------------------
  banana-flow-admin-web-v3:
    image: banana-flow-admin-web-v3:${WEB_VERSION:-latest}
    container_name: banana-flow-admin-web-v3
    restart: always
    ports:
      - "${HOST_PORT_WEB:-18000}:80"
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/usr/share/nginx/static
    depends_on:
      - banana-flow-admin-server-py
    networks:
      - banana-flow-admin-network

networks:
  banana-flow-admin-network:
    driver: bridge